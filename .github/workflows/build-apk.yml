name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & Package Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Remove old artifact cache
        run: rm -rf ~/.gradle/caches/transforms-* app/build/

      - name: Prepare build environment
        env:
          SECRET_DEBUG_KEYSTORE_BASE64: ${{ secrets.SECRET_DEBUG_KEYSTORE_BASE64 }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'UNCONFIGURED' }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL || 'https://api.openai.com/v1' }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'gpt-4o-mini' }}
        run: |
          set -e

          touch .env.example
          cat > .env <<EOF
          OPENAI_API_KEY=${OPENAI_API_KEY}
          OPENAI_BASE_URL=${OPENAI_BASE_URL}
          OPENAI_MODEL=${OPENAI_MODEL}
          EOF

          if [ -n "$SECRET_DEBUG_KEYSTORE_BASE64" ]; then
            echo "$SECRET_DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
          elif [ ! -s debug.keystore ]; then
            echo "SECRET_DEBUG_KEYSTORE_BASE64 is not set; generating standard debug.keystore..."
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -s debug.keystore ]; then
            echo "::error::Missing debug keystore. Add SECRET_DEBUG_KEYSTORE_BASE64 in GitHub repo secrets."
            exit 1
          fi

      - name: Build Debug APK
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'UNCONFIGURED' }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL || 'https://api.openai.com/v1' }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'gpt-4o-mini' }}
        run: |
          echo "=== Before build ==="
          find app/build -name "app-debug.apk" -exec ls -lah {} \; 2>/dev/null || echo "No previous build found"
          echo "=== Running gradle clean build ==="
          gradle clean :app:assembleDebug --info
          echo "=== After build ==="
          ls -lah app/build/outputs/apk/debug/app-debug.apk
          file app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK exists
        run: ls -lah app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.run_number }}-${{ github.run_attempt }}-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
