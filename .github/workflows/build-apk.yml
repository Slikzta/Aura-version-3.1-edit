name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build & Package Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare build environment
        run: |
          API_KEY="${SECRET_OPENAI_API_KEY:-UNCONFIGURED}"
          if [ -z "$API_KEY" ]; then
            API_KEY="UNCONFIGURED"
          fi

          BASE_URL="${SECRET_OPENAI_BASE_URL:-https://api.openai.com/v1}"
          if [ -z "$BASE_URL" ]; then
            BASE_URL="https://api.openai.com/v1"
          fi

          MODEL="${SECRET_OPENAI_MODEL:-gpt-4o-mini}"
          if [ -z "$MODEL" ]; then
            MODEL="gpt-4o-mini"
          fi

          cat <<EOF > .env
OPENAI_API_KEY=$API_KEY
OPENAI_BASE_URL=$BASE_URL
OPENAI_MODEL=$MODEL
EOF

          cat <<EOF > .env.example
OPENAI_API_KEY=UNCONFIGURED
OPENAI_BASE_URL=https://api.openai.com/v1
OPENAI_MODEL=gpt-4o-mini
EOF

          if [ -n "$SECRET_DEBUG_KEYSTORE_BASE64" ]; then
            echo "$SECRET_DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "Generating debug.keystore automatically..."
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
        env:
          SECRET_DEBUG_KEYSTORE_BASE64: ${{ secrets.SECRET_DEBUG_KEYSTORE_BASE64 }}
          SECRET_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SECRET_OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          SECRET_OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}

      - name: Build Debug APK
        run: gradle :app:assembleDebug
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'UNCONFIGURED' }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL || 'https://api.openai.com/v1' }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'gpt-4o-mini' }}

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.run_number }}-${{ github.run_attempt }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
